[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-table-tool"
version = "1.0.0"
description = "Flatten PDF, Word and Excel tables into clean bullet points, patched into the original file"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "thichankem" }]
keywords = ["pdf", "docx", "xlsx", "table", "rag", "text-extraction"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]
dependencies = [
    "pymupdf>=1.23.0,<2.0",
    "pdfplumber>=0.10.0,<1.0",
    "python-docx>=1.1.0,<2.0",
    "openpyxl>=3.1.0,<4.0",
]

[project.urls]
Homepage = "https://github.com/thichankem/pdf-table-flattener"
Issues = "https://github.com/thichankem/pdf-table-flattener/issues"

[project.optional-dependencies]
# Drag-and-drop in the GUI; the file picker works without it.
gui = ["tkinterdnd2>=0.4.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
pdf-flattener = "pdf_table_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
