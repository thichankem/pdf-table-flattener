[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-table-tool"
version = "1.0.0"
description = "Flatten PDF tables into clean bullet points directly patched on original PDF"
authors = [{ name = "PDF Table Tool Team" }]
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
pdf-flattener = "cli:main"
